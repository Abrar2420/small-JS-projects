<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./output.css" />
    <title>Document</title>
  </head>
  <body>
    <!-- ==== full display of the webpage ===== -->
    <main class="light font-inter bg-main">
      <!-- ======= container ======= -->
      <div class="container m-auto p-4 h-lvh">
        <!-- ======= full quote box ======= -->
        <div class="flex justify-center items-center h-full">
          <!-- ======= quote grid ======= -->
          <div class="grid xl:grid-cols-3 md:grid-cols-2 sm:grid-cols-1 gap-8">
            <!-- ======= quote box ======= -->
            <div
              class="flex flex-col p-4 rounded-lg min-h-[195px] justify-around bg-card shadow-xl"
            >
              <!-- =========== quote =========  -->
              <blockquote class="text-quote font-medium font-serif text-xl">
                “Simplicity is about removing the unnecessary so the necessary
                can speak clearly.”
              </blockquote>
              <!-- ========= author =========== -->
              <span
                class="text-author text-lg italic font-normal inline-block self-end"
              >
                — John Maeda
              </span>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
