<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Student Manager</title>
  </head>
  <body class="bg-slate-100">
    <header>
      <nav>
        <div class="w-full bg-indigo-800">
          <div class="container mx-auto px-4">
            <div class="flex items-center justify-between py-6 mb-32">
              <!-- nav logo and menu  -->
              <div class="flex items-center gap-32">
                <div>
                  <h1 class="text-2xl text-white font-bold">
                    Student Dashboard
                  </h1>
                </div>
                <div>
                  <ul class="flex items-center gap-8">
                    <li><a class="text-white" href="#">Students</a></li>
                    <li><a class="text-white" href="#">Sections</a></li>
                    <li><a class="text-white" href="#">Results</a></li>
                    <li><a class="text-white" href="#">Rankings</a></li>
                    <li><a class="text-white" href="#">Teachers</a></li>
                  </ul>
                </div>
              </div>
              <!-- profile part -->
              <div>
                <a
                  href="./userProfile.html"
                  class="flex items-center space-x-3 rtl:space-x-reverse"
                >
                  <img
                    src="https://static.vecteezy.com/system/resources/thumbnails/048/216/761/small/modern-male-avatar-with-black-hair-and-hoodie-illustration-free-png.png"
                    class="h-9"
                    alt="Flowbite Logo"
                  />
                </a>
              </div>
            </div>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <!-- Students section with all details  -->
      <section>
        <div class="container mx-auto px-4">
          <div id="all-students" class="grid grid-cols-2 gap-x-8 gap-y-10">
            <div class="flex justify-around p-6 rounded-lg shadow-lg bg-white">
              <div>
                <h3 class="mb-2 text-lg font-bold">Studetn details</h3>
                <p class="flex gap-3 justify-between">
                  <span class="font-bold">Name:</span>
                  <span>Abrar Hossain</span>
                </p>
                <p class="flex gap-3 justify-between">
                  <span class="font-bold">Roll:</span> <span>101</span>
                </p>
                <p class="flex gap-3 justify-between">
                  <span class="font-bold">Class:</span> <span>11</span>
                </p>
                <p class="flex gap-3 justify-between">
                  <span class="font-bold">section:</span> <span>A</span>
                </p>
              </div>
              <div class="h-full">
                <span class="bg-gray-700 px-[0.5px] h-full inline-block"></span>
              </div>
              <div>
                <h3 class="mb-2 text-lg font-bold">Grades</h3>
                <p class="flex gap-12 justify-between">
                  <span class="font-bold">Math:</span>
                  <span>67</span>
                </p>
                <p class="flex gap-12 justify-between">
                  <span class="font-bold">Physics:</span> <span>39</span>
                </p>
                <p class="flex gap-12 justify-between">
                  <span class="font-bold">Chemisry:</span> <span>98</span>
                </p>
                <p class="flex gap-12 justify-between">
                  <span class="font-bold">English:</span> <span>76</span>
                </p>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="./src/student/student.js"></script>
  </body>
</html>
